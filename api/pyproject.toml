[tool.poetry]
name = "residueloop-api"
version = "0.1.0"
description = "Backend API for ResidueLoop"
authors = ["ResidueLoop Team <team@residueloop.example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
supabase = "^2.4.0"
httpx = "^0.27.0"
celery = "^5.4.0"
redis = "^5.0.0"
apscheduler = "^3.10.0"
python-multipart = "^0.0.32"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
